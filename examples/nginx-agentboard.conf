server {
    listen 80;
    server_name agentboard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agentboard.example.com;

    ssl_certificate /etc/letsencrypt/live/agentboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentboard.example.com/privkey.pem;

    # Streamable HTTP MCP；关闭缓冲，保留长连接和 Bearer 请求头。
    location /mcp {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dual-stack BFF: grayscale cutover.
    #
    # Stage 0 (current default): all /api/* traffic is served by FastAPI on :8000.
    # Stage 1 (shadow): the BFF receives a copy of every request via a sidecar.
    # Stage 2 (grayscale): the upstream switches progressively from :8000 to
    #         :18000 (api-dotnet). Edit the proxy_pass URL below to flip the
    #         weight: nginx's `upstream` block below allows per-request split.
    #
    # During cutover, both services are running; the contract-freeze tests
    # (see .github/workflows/dotnet-contract-check.yml) verify the .NET BFF
    # matches the FastAPI /openapi.json on every PR.
    upstream api_dotnet {
        # Replace the placeholder with the real BFF weight once Stage 2 lands.
        # 0% grayscale: server 127.0.0.1:8000; 100%: server 127.0.0.1:18000.
        server 127.0.0.1:8000;       # FastAPI (current default upstream)
        server 127.0.0.1:18000 backup;  # .NET BFF (kicks in when :8000 fails)
    }

    location /api/ {
        proxy_pass http://api_dotnet;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        # Belt and braces: when the .NET BFF returns a 5xx during grayscale
        # we want the FastAPI fallback to absorb the error, not the user.
        proxy_next_upstream error timeout http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
