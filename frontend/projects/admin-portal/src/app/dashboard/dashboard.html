<app-nav-bar></app-nav-bar>

<main class="content">
  <section class="welcome card">
    <h1>欢迎回来，<span class="who">{{ user()?.username || 'Admin' }}</span> 👋</h1>
    <p>管理控制台已就绪。使用上方导航进入「用户管理」「项目管理」等模块。</p>
  </section>

  <div class="grid">
    <div class="card stat">
      <span class="stat-label">当前账户</span>
      <span class="stat-value">{{ user()?.username || 'Admin' }}</span>
    </div>
    <div class="card stat">
      <span class="stat-label">角色</span>
      <span class="stat-value">{{ user()?.is_admin ? '管理员' : '普通用户' }}</span>
    </div>
    <div class="card stat">
      <span class="stat-label">路由守卫</span>
      <span class="stat-value">已启用</span>
    </div>
  </div>
</main>
