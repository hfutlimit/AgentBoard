<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AgentBoard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      window.AGENTBOARD_API = '__API_URL__';
    </script>
    <script>
      // Apply the saved/system theme before Angular paints to avoid a light-theme flash.
      (() => {
        const saved = localStorage.getItem('agentboard_theme');
        const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <!-- Epic 149 / Story 317: 原型 v7 SVG symbol 库（24 图标），全局隐藏，供 <use href="#i-xxx"> 引用 -->

</html>
