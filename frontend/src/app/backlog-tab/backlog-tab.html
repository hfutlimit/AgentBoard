<app-managed-list
  [loading]="loading"
  [error]="error"
  errorPrefix="Backlog 加载失败"
  loadingLabel="正在加载 Backlog 列表…"
  [skeletonRows]="5"
  [empty]="!loading && !error && tasks.length === 0"
  [hidePaginationOnEmpty]="true"
  [total]="tasks.length"
  [page]="page"
  [pageSize]="pageSize"
  paginationLabel="Backlog 列表"
  (pageChange)="pageChange.emit($event)"
  (retry)="retry.emit()">
  <ng-container ml-header>
    <!-- Epic 150 / X3 supplement: 工作项 heading（prototype 09 对齐） -->
    <app-workspace-heading
      title="工作项"
      subtitle="项目的任务、缺陷和交付状态。">
      <span class="heading-title-badge count">{{ tasks.length }}</span>
    </app-workspace-heading>
  </ng-container>
  @if (tasks.length) {
    <div class="entity-list backlog-tab-v7" id="backlog-list">
      @for (task of paginatedItems(tasks, page); track task.id) {
        <div class="entity-item">
          <a [routerLink]="['/task', task.id]" class="entity-item-main">
            <span class="type-icon {{ task.type }}">{{ typeGlyph(task.type) }}</span>
            <span class="entity-item-title">{{ task.title }}</span>
          </a>
          <div class="entity-item-badges">
            <span class="badge status status--{{ task.status }}">{{ statusLabel(task.status) }}</span>
            @if (task.priority !== 'medium') {
              <span class="badge priority priority--{{ task.priority }}">{{ priorityLabel(task.priority) }}</span>
            }
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="empty-inline">Backlog 为空，所有任务已分配 Sprint</div>
  }
</app-managed-list>
