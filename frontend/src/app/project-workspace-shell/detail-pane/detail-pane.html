@if (selection(); as sel) {
  <aside class="detail-pane" role="complementary" aria-label="详情面板">
    <header class="detail-pane-header">
      <div class="detail-pane-kind">
        @if (meta(); as m) {
          <svg class="detail-pane-icon" aria-hidden="true"><use [attr.href]="'#' + m.iconId"></use></svg>
          <span class="detail-pane-label">{{ m.label }}</span>
        }
        <span class="detail-pane-id">#{{ sel.id }}</span>
      </div>
      <button
        type="button"
        class="detail-pane-close"
        aria-label="关闭详情面板"
        (click)="onClose($event)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 0 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06z"/>
        </svg>
      </button>
    </header>
    <div class="detail-pane-body">
      <h2 class="detail-pane-title">
        {{ sel.title || (meta()?.label + ' #' + sel.id) }}
      </h2>
      <p class="detail-pane-hint muted">
        详情渲染将在下一个 commit 完成（Step 2：提取 app.html &#64;case 的内容到独立 component）。
      </p>
      <p class="detail-pane-hint muted">
        现在你可以选择：
      </p>
      <ul class="detail-pane-actions">
        <li>
          <a [routerLink]="fullPath()" class="btn-primary-sm" (click)="onOpenFull($event)">
            在全页打开 {{ meta()?.label }} #{{ sel.id }}
          </a>
        </li>
        <li>
          <button type="button" class="btn-ghost-sm" (click)="onClose($event)">关闭此面板</button>
        </li>
      </ul>
    </div>
  </aside>
}
