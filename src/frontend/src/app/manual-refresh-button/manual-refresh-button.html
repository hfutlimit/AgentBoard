<button
  type="button"
  class="btn refresh-btn manual-refresh-button"
  [class.is-busy]="refreshing()"
  [attr.id]="buttonId() || null"
  [disabled]="refreshing()"
  [attr.aria-label]="resolvedTitle()"
  [attr.aria-busy]="refreshing() ? 'true' : null"
  [attr.title]="resolvedTitle()"
  (click)="onClick($event)">
  @if (refreshing()) {
    <span class="refresh-spinner" aria-hidden="true"></span>
  } @else {
    <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="23 4 23 10 17 10"/>
      <polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
  }
</button>
