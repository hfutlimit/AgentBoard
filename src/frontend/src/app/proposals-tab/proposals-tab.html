<app-managed-list
  [loading]="loading"
  [error]="error"
  errorPrefix="提案加载失败"
  loadingLabel="正在加载提案列表…"
  [skeletonRows]="4"
  [empty]="!loading && !error && proposals.length === 0"
  [pageSize]="0"
  (retry)="retry.emit()">
  <ng-container ml-header>
    <!-- Epic 150 / X3 supplement: 提案 heading（prototype 对齐） -->
    <app-workspace-heading
      title="需求提案"
      subtitle="围绕当前项目提交需求，由 Agent 逐轮澄清并收敛为可执行 Story。">
      <button id="proposal-list-refresh-btn" class="heading-action-btn btn icon-btn refresh-btn" type="button"
        (click)="refresh.emit()" [disabled]="refreshing"
        [title]="refreshing ? '刷新中…' : '刷新提案列表'">
        @if (refreshing) {
          <span class="refresh-spinner" aria-hidden="true"></span>
        } @else {
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        }
        <span class="refresh-label">{{ refreshing ? '刷新中' : '刷新' }}</span>
      </button>
      <button id="new-project-proposal-btn" class="heading-action-btn btn-primary-sm" (click)="createProposal.emit()">＋ 新建提案</button>
    </app-workspace-heading>
  </ng-container>
  <div class="row doc-toolbar proposals-tab-v7" ml-toolbar>
    <select
      id="project-proposal-status-filter"
      class="doc-filter-select"
      [value]="filterStatus"
      (change)="filterStatusChange.emit($any($event.target).value)">
      <option value="">全部状态</option>
      @for (s of statuses; track s) {
        <option [value]="s">{{ proposalStatusLabel(s) }}</option>
      }
    </select>
    <input
      type="search"
      id="project-proposal-search"
      class="doc-search-input"
      placeholder="搜索标题 / 正文…"
      [value]="searchQuery"
      (input)="searchQueryChange.emit($any($event.target).value)" />
  </div>
  @if (proposals.length === 0) {
    <div class="empty-state">当前项目还没有提案。点击上方「＋ 新建提案」，把想法交给 Agent 澄清。</div>
  } @else {
    <div class="proposal-list">
      @for (p of proposals; track p.id) {
        <a
          class="proposal-row"
          [attr.href]="'/project/' + projectId + '/proposals/' + p.id"
          (click)="openProposal.emit({ event: $event, proposal: p })">
          <div class="proposal-row-main">
            <div class="proposal-row-title">{{ p.title }}</div>
            <div class="proposal-row-meta">
              <span>第 {{ p.current_round }} 轮</span>
              <span class="dot-sep">·</span>
              <time>{{ timeAgo(p.updated_at) }}</time>
            </div>
          </div>
          <span class="badge pstatus pstatus--{{ p.status }}">{{ proposalStatusLabel(p.status) }}</span>
        </a>
      }
    </div>
  }
</app-managed-list>
