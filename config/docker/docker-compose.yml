# AgentBoard 容器编排
#
# 默认启动（MariaDB 持久化）：
#   docker compose up -d
#   打开 http://localhost:8080  （Web 前端，浏览器经 http://localhost:8000 调 API）
#   API 文档：http://localhost:8000/docs
#   MariaDB 宿主机访问端口：13306（容器内 3306；AGENTBOARD_DB_URL 用 db:3306）
#
# 注意：AGENTBOARD_SECRET 为必填项，启动前需导出（如 export AGENTBOARD_SECRET=xxx）
#   或写入项目根 .env（勿提交）。
#
# 如需回退到本地 SQLite（开发）：
#   将 api.environment 的 AGENTBOARD_DB_URL 改回 sqlite:////app/data/agentboard.db
#   并恢复 api 的 volumes: - agentboard_data:/app/data（需同时恢复 volumes.agentboard_data）
#
# Dual-stack BFF（Stage 0 启用，Stage 1 切流）：
#   api-dotnet 是 .NET 10 WebAPI，对外端口 18000（容器内 8080）
#   默认与 api (FastAPI) 并行运行；nginx 切流脚本（Stage 2 启用）将 /api/* 切到 api-dotnet
#

# 生产域名部署：设置 Web 注入给浏览器的 API 地址
#   AGENTBOARD_WEB_API_URL=https://api.yourdomain.com docker compose up -d

services:
  api:
    build:
      context: ../..
      dockerfile: src/backend-fastapi/Dockerfile
    command: uvicorn agentboard.api:app --host 0.0.0.0 --port 8000
    environment:
      # 生产数据库：MariaDB（容器名 db，内部端口 3306）
      AGENTBOARD_DB_URL: "mysql+pymysql://agentboard:${MARIADB_PASSWORD:?Set MARIADB_PASSWORD}@db:3306/agentboard"
      # 生产务必改为强随机值（可用 openssl rand -hex 32 生成）
      AGENTBOARD_SECRET: "${AGENTBOARD_SECRET:?Set AGENTBOARD_SECRET to a strong random value}"
      # 远程部署默认保护 REST 业务接口；注册/登录和 /api/meta 保持公开
      AGENTBOARD_REQUIRE_AUTH: "1"
      AGENTBOARD_ALLOW_REGISTRATION: "${AGENTBOARD_ALLOW_REGISTRATION:-0}"
      AGENTBOARD_ENV: "${AGENTBOARD_ENV:-production}"
      AGENTBOARD_CORS_ORIGINS: "${AGENTBOARD_CORS_ORIGINS:?Set AGENTBOARD_CORS_ORIGINS to the public Web origin}"
      AGENTBOARD_TOKEN_TTL_SECONDS: "${AGENTBOARD_TOKEN_TTL_SECONDS:-2592000}"
      # Optional shared secret for the FastAPI -> .NET SignalR notification bridge.
      AGENTBOARD_REALTIME_NOTIFY_URL: "http://api-dotnet:8080/api/internal/realtime/proposals/questions"
      AGENTBOARD_REALTIME_INTERNAL_KEY: "${AGENTBOARD_REALTIME_INTERNAL_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/meta').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # .NET 10 WebAPI (BFF). Stage 0: parallels api (FastAPI) on a separate port.
  # Stage 2 grayscale: nginx cuts /api/* traffic to api-dotnet. Until then both
  # stacks are reachable and the contract-freeze tests (S0-4/S0-5) validate
  # the .NET endpoints against the FastAPI /openapi.json.
  api-dotnet:
    build:
      context: ../..
      dockerfile: src/backend-dotnet/Dockerfile
    environment:
      # Same secret as api — the BFF re-uses the FastAPI HMAC tokens as-is.
      AGENTBOARD_SECRET: "${AGENTBOARD_SECRET:?Set AGENTBOARD_SECRET to a strong random value}"
      # .NET BFF uses SQLite by default in compose. Stage 1 will add a Pomelo
      # MySql provider once the package ships 10.0.0; until then MariaDB is
      # only consulted by the FastAPI api service.
      AGENTBOARD_DATABASE__PROVIDER: "sqlite"
      AGENTBOARD_DATABASE__CONNECTIONSTRING: "Data Source=/app/data/agentboard-dotnet.db"
      AGENTBOARD_ENV: "${AGENTBOARD_ENV:-production}"
      AGENTBOARD_REQUIRE_AUTH: "1"
      AGENTBOARD_CORS_ORIGINS: "${AGENTBOARD_CORS_ORIGINS:-*}"
      # Container-internal bind; host-side mapping is set via
      # AGENTBOARD_DOTNET_PORT below. Program.cs reads this env var and
      # calls UseUrls() — do not also set ASPNETCORE_URLS (would conflict).
      AGENTBOARD_DOTNET_PORT: "8080"
      # Internal address the .NET BFF uses to call FastAPI for AI orchestration
      # (Stage 1 wires this through Polly + token passthrough).
      AGENTBOARD_FASTAPI__INTERNALURL: "http://api:8000"
      AGENTBOARD_FASTAPI__INTERNALONLY: "0"
      AGENTBOARD_REALTIME_INTERNAL_KEY: "${AGENTBOARD_REALTIME_INTERNAL_KEY:-}"
      # P1-6: extend the default trusted-proxy allowlist (loopback +
      # RFC1918) with the docker bridge network. The FastAPI api container
      # is the only legitimate caller of /api/internal/realtime/* and it
      # lives in 172.16.0.0/12 in compose.
      AgentBoard__Realtime__TrustedProxies__0: "10.0.0.0/8"
      AgentBoard__Realtime__TrustedProxies__1: "172.16.0.0/12"
      AgentBoard__Realtime__TrustedProxies__2: "192.168.0.0/16"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host 18099 → container 8080 (FastAPI api 占用宿主 18000，.NET 用 18099 避免宿主端口冲突).
      - "${AGENTBOARD_DOTNET_PORT:-18099}:8080"
    volumes:
      # The .NET BFF keeps its own SQLite file (no shared-schema writes until
      # Stage 2). In Stage 1 the BFF reads via the MariaDB wire (Pomelo) and
      # this volume can be removed.
      - agentboard_dotnet_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: src/backend-fastapi/Dockerfile
    command: uvicorn agentboard.web_app:app --host 0.0.0.0 --port 8080
    environment:
      # 注：此地址由浏览器（用户机器）发起请求，必须用宿主机可访问地址，
      # 默认 localhost:8000 适用于本机 docker；生产改为真实域名/IP。
      AGENTBOARD_API_URL: "${AGENTBOARD_WEB_API_URL:?Set AGENTBOARD_WEB_API_URL to the browser-accessible API URL}"
      AGENTBOARD_WEB_SIGNALR_URL: "${AGENTBOARD_WEB_SIGNALR_URL:-}"
    ports:
      - "28080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp:
    build:
      context: ../..
      dockerfile: src/backend-fastapi/Dockerfile
    command: python -m agentboard.mcp_server
    environment:
      AGENTBOARD_MCP_TRANSPORT: "http"
      AGENTBOARD_MCP_HOST: "0.0.0.0"
      AGENTBOARD_MCP_PORT: "8001"
      AGENTBOARD_MCP_PATH: "/mcp"
      AGENTBOARD_MCP_REQUIRE_AUTH: "${AGENTBOARD_MCP_REQUIRE_AUTH:-1}"
      # REQUIRE_AUTH=0 时 MCP 以此固定令牌身份访问 API（支持 abk_ API Key）；
      # 权限作用域 = 该 Key 关联用户（admin 全量 / 普通用户仅成员项目）
      AGENTBOARD_MCP_TOKEN: "${AGENTBOARD_MCP_TOKEN:-}"
      AGENTBOARD_API_URL: "http://api:8000"
      # 必须与 API 完全一致，MCP 才能验证 Token
      AGENTBOARD_SECRET: "${AGENTBOARD_SECRET:?Set AGENTBOARD_SECRET to a strong random value}"
      AGENTBOARD_TOKEN_TTL_SECONDS: "${AGENTBOARD_TOKEN_TTL_SECONDS:-2592000}"
    ports:
      # 8001 被 Windows 系统保留 (Hyper-V 动态端口范围 7921-8020, 实测 8000-8082 整段不可用),
      # 改用 18001 暴露到宿主机 (容器内端口仍为 8001)
      - "18001:8001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 生产数据库：MariaDB（随 up -d 默认启动）
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: agentboard
      MARIADB_USER: agentboard
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?Set MARIADB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}"
    volumes:
      - agentboard_mariadb:/var/lib/mysql
    # 宿主机映射：主机 3306 已被占用，改用 13306 便于本地工具/迁移连接；
    # 容器内仍为 3306，AgentBoard 服务经 docker 网络 db:3306 访问。
    ports:
      - "127.0.0.1:13306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  agentboard_mariadb:
  agentboard_dotnet_data:
