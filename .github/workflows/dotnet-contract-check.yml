# SPDX-License-Identifier: MIT
name: dotnet contract check

# Fails the build if the committed OpenAPI snapshot / generated FastAPI
# client doesn't match the live FastAPI /openapi.json, or if the
# generated client file hasn't been regenerated after a contract change.
#
# This workflow is the single source of truth for the dual-stack
# contract-freeze rules documented in
# openspec/changes/dual-stack-bff-restructure/design.md §3.

on:
  push:
    branches: [main]
    paths:
      - 'src/backend-fastapi/**'
      - 'src/backend-dotnet/src/**'
      - 'src/backend-dotnet/tests/**'
      - 'src/backend-dotnet/contracts/**'
      - 'scripts/**'
      - 'config/docker/docker-compose.yml'
      - '.github/workflows/dotnet-contract-check.yml'
  pull_request:
    paths:
      - 'src/backend-fastapi/**'
      - 'src/backend-dotnet/src/**'
      - 'src/backend-dotnet/tests/**'
      - 'src/backend-dotnet/contracts/**'
      - 'scripts/**'
      - 'config/docker/docker-compose.yml'
      - '.github/workflows/dotnet-contract-check.yml'

jobs:
  contract:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSwag CLI
        run: dotnet tool install --global NSwag.ConsoleCore --version 14.5.0

      - name: Add tools to PATH
        run: echo "$env:USERPROFILE\.dotnet\tools" | Out-File -Append $env:GITHUB_PATH

      - name: Hash-check committed snapshot
        run: python scripts/schema-drift-check.py

      # The --check-live step requires a running FastAPI. The CI runner
      # does not host one; the live drift check is a manual operation
      # performed locally before opening a PR that touches contracts/.
      # Uncomment + add a FastAPI service to the job when we wire one
      # into CI in a later stage.
      #
      # - name: Start FastAPI + live drift check
      #   run: |
      #     docker compose up -d api
      #     python scripts/schema-drift-check.py --check-live
      #     docker compose down

      - name: Regenerate FastAPI client
        run: pwsh scripts/generate-fastapi-client.ps1

      - name: Verify committed client matches regenerated client
        run: |
          $generatedPaths = @(
            'src/backend-dotnet/src/AgentBoard.Api/Clients/AgentBoardFastApiClient.cs',
            'src/backend-dotnet/contracts/openapi-v3.json',
            'src/backend-dotnet/contracts/openapi-v3.sha256'
          )
          $changedPaths = @()
          foreach ($path in $generatedPaths) {
            git diff --quiet -- $path
            if ($LASTEXITCODE -ne 0) { $changedPaths += $path }
          }
          if ($changedPaths.Count -gt 0) {
            Write-Host "::error::Committed client or snapshot does not match freshly-generated output."
            Write-Host "Run pwsh scripts/sync-openapi.ps1 + pwsh scripts/generate-fastapi-client.ps1 locally and commit the diff."
            Write-Host "Changed paths: $($changedPaths -join ', ')"
            git diff --stat
            exit 1
          }
          Write-Host "Client and snapshot are in sync."

      - name: Build .NET solution
        run: dotnet build src/backend-dotnet/AgentBoard.slnx --nologo -c Release

      - name: Run .NET tests
        run: dotnet test src/backend-dotnet/AgentBoard.slnx --nologo -c Release --no-build

  # Close the NU1902/NU1903 security gate: every reported advisory must be on
  # the curated allowlist (src/backend-dotnet/security-allowlist.json). Any NEW (un-reviewed)
  # advisory turns this job red (fail-closed). See src/backend-dotnet/SECURITY-AUDIT.md.
  security-audit:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore src/backend-dotnet/AgentBoard.slnx

      - name: Run NuGet audit gate
        run: python scripts/nuget-audit-gate.py --report security-audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audit-report.json
          if-no-files-found: warn

  # Live contract-drift gate. Boots the real FastAPI stack and diffs its
  # /openapi.json against the committed .NET BFF snapshot. Fail-closed:
  #   - FastAPI unreachable  -> exit 2 -> job red
  #   - unapproved drift     -> exit 1 -> job red
  #   - match / approved diff -> exit 0
  # Intentional breaking changes are approved by committing an
  # `approved-drift` JSON (docs/contracts/contract-freeze.md) together with
  # a refreshed snapshot in the same PR.
  live-drift:
    # The compose stack uses Linux images (MariaDB + Python). GitHub's Windows
    # runner cannot host that stack reliably; keep PowerShell steps but run
    # them on the Linux runner with Docker preinstalled.
    runs-on: ubuntu-latest
    env:
      AGENTBOARD_SECRET: ci-contract-test-secret-at-least-32-bytes
      MARIADB_PASSWORD: ci-contract-test
      MARIADB_ROOT_PASSWORD: ci-contract-root-test
      AGENTBOARD_CORS_ORIGINS: http://localhost:28080
      AGENTBOARD_WEB_API_URL: http://localhost:18000
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Start FastAPI stack
        run: docker compose -f config/docker/docker-compose.yml up -d api

      - name: Wait for FastAPI /openapi.json
        run: |
          $url = "http://localhost:18000/openapi.json"
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host "FastAPI is up."; exit 0 }
            } catch {}
            Start-Sleep -Seconds 5
          }
          Write-Host "::error::FastAPI did not become reachable in time."
          docker compose -f config/docker/docker-compose.yml logs api
          exit 1

      - name: Live drift check
        run: python scripts/schema-drift-check.py --check-live --approved-drift .github/contract-approved-drift.json --report drift-report.json

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-drift-report
          path: drift-report.json
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose -f config/docker/docker-compose.yml down -v
