# SPDX-License-Identifier: MIT
name: application stack check

on:
  push:
    branches: [main]
    paths:
      - 'src/backend-fastapi/**'
      - 'src/frontend/**'
      - 'src/nodes/**'
      - 'tests/**'
      - '.github/workflows/application-stack-check.yml'
  pull_request:
    paths:
      - 'src/backend-fastapi/**'
      - 'src/frontend/**'
      - 'src/nodes/**'
      - 'tests/**'
      - '.github/workflows/application-stack-check.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install backend dependencies
        run: python -m pip install -r src/backend-fastapi/requirements.txt
      - name: Verify Alembic clean upgrade and RunEvent audit schema
        working-directory: src/backend-fastapi
        env:
          AGENTBOARD_DB_URL: sqlite:///ci-agentboard-migrations.db
          PYTHONPATH: .
        run: |
          python -c "from agentboard.database import init_db; init_db()"
          python -c "from agentboard.database import engine; from sqlalchemy import inspect; cols={c['name'] for c in inspect(engine).get_columns('agent_run_events')}; required={'actor_username_snapshot','api_key_prefix_snapshot','agent_ref_snapshot'}; assert required <= cols, (required, cols)"
      - name: Compile backend
        run: python -m compileall -q src/backend-fastapi/agentboard
      - name: Run focused backend tests
        env:
          AGENTBOARD_DB_URL: sqlite:///ci-agentboard.db
          AGENTBOARD_REQUIRE_AUTH: '0'
          PYTHONPATH: src/backend-fastapi
        run: |
          python -m pytest tests/test_run_authorization.py -q
          python -m pytest \
            tests/test_worker_execution_records.py \
            tests/test_run_event_contract.py \
            tests/test_run_search.py \
            -q
          python -m pytest tests/test_run_read_authorization.py -q
          python -m pytest tests/test_p0_runtime_hardening.py tests/unit/test_runtime_security.py -q
          python -m pytest tests/test_run_event_bus.py -q
          python -m pytest tests/test_proposal_realtime.py -q
          python -m pytest tests/test_api_keys.py -q
          for test_file in \
            tests/test_domain_boundaries.py \
            tests/unit/test_behavior_models.py \
            tests/unit/test_behavior_resolver.py \
            tests/unit/test_execution_context_builder.py \
            tests/unit/test_execution_contract_review.py \
            tests/unit/test_learning_p1_fixes.py \
            tests/test_learning_judge.py \
            tests/test_learning_memory.py \
            tests/unit/test_learning_evaluator.py \
            tests/unit/test_learning_extractor.py \
            tests/unit/test_learning_retriever.py \
            tests/unit/test_prompt_blocks.py \
            tests/unit/test_prompt_builder.py \
            tests/unit/test_proposal_p1_fixes.py \
            tests/unit/test_routed_subprocess_invoker.py \
            tests/unit/test_stage0_worker_resilience.py \
            tests/unit/test_story_async_executor.py \
            tests/unit/test_task_state_machine.py \
            tests/unit/test_worker_coordinator.py; do
            python -m pytest "$test_file" -q
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run build
      - name: Run frontend tests
        run: npm test -- --watch=false

  worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate worker install assets
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install-node.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          Get-Content 'src/nodes/AgentBoard.Node/appsettings.Production.json' -Raw |
            ConvertFrom-Json | Out-Null
      - name: Test AgentBoard.Node
        run: dotnet test src/nodes/AgentBoard.Node.Tests/AgentBoard.Node.Tests.csproj --nologo -c Release

  golden-cross-stack:
    name: Proposal to Story Done golden gate
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: agentboard
          MARIADB_USER: agentboard
          MARIADB_PASSWORD: golden_pass
          MARIADB_ROOT_PASSWORD: golden_root_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: agentboard
          RABBITMQ_DEFAULT_PASS: agentboard_dev_pass
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install backend dependencies
        run: python -m pip install -r src/backend-fastapi/requirements.txt
      - name: Build AgentBoard.Node
        run: dotnet build src/nodes/AgentBoard.Node/AgentBoard.Node.csproj --nologo -c Release
      - name: Run real Proposal to Story Done gate
        env:
          AGENTBOARD_RUN_GOLDEN_CROSS_STACK: '1'
          AGENTBOARD_GOLDEN_DB_URL: mysql+pymysql://agentboard:golden_pass@127.0.0.1:3306/agentboard
          AGENTBOARD_MQ_URL_TEST: amqp://agentboard:agentboard_dev_pass@127.0.0.1:5672/%2F
          PYTHONPATH: src/backend-fastapi
        run: python -m pytest tests/e2e/cross_stack/test_proposal_full_happy_path.py -q -s
