[pytest]
# 仓库根级配置（2026-09-01 P0 修复轮顺手治理）：
# - 默认 `pytest` = unit + integration（与 e2e-plan/README 工作流一致）
# - E2E 用 `pytest -m e2e` 显式启用（会覆盖这里的 -m）
# - 直连 dev server 的手工评审脚本在 conftest.py collect_ignore 里永久排除
markers =
    manual: legacy integration scripts that are skipped during pytest collection
    legacy: legacy manual E2E wrappers that are skipped by default
    e2e: 端到端测试（Playwright / cross-stack，需要 live stack）
    unit: 单元测试（in-memory FastAPI）
    slow: 慢测试（> 5s）
testpaths = tests
addopts =
    --tb=short
    -m "not e2e and not manual and not legacy"
