# pytest config for AgentBoard (2026-08-20 Epic 151 / Story 330)
#
# 重点：
# 1. e2e marker 让 `pytest -m e2e` 可选择性跑 E2E（不跑 unit）
# 2. 默认 tests/ 根目录收集，但 e2e 默认 SKIP（需 -m e2e 显式启用）
# 3. 与现有 test_*.py 函数测试兼容
#
# 早期脚本时代（tests/e2e_epic149/test_*.py 用 main() + sys.exit），
# pytest 因 0 个 test_xxx() 函数而报"no tests ran"，但用户可以：
#   pytest -m e2e tests/e2e_epic149/   # 收 0 test，因脚本化
# 后续 Task 1323 改造为 test_xxx() 后，pytest 自动收集

[pytest]
markers =
    manual: legacy integration scripts that are skipped during pytest collection
    legacy: legacy manual E2E wrappers that are skipped by default
    e2e: 端到端测试（Playwright 驱动，需要 ng serve + dev API）
    unit: 单元测试（in-memory FastAPI）
    slow: 慢测试（> 5s）
testpaths = tests
addopts =
    -v
    --tb=short
    # 缺省只跑非 e2e；用 -m e2e 显式启用 E2E
    -m "not e2e"
